    # flake8-pie
    "PIE790", "PIE794", "PIE796", "PIE800", "PIE804", "PIE807", "PIE808", "PIE810",
    # Pylint (conventions)
    "PLC0105", "PLC0131", "PLC0132", "PLC0205", "PLC0206", "PLC0208", "PLC0414",
    "PLC3002",
    # Pylint (errors)
