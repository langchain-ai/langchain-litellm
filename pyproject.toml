    # flake8-type-checking
    "TC004", "TC005", "TC007", "TC010",
    # tryceratops
    "TRY002", "TRY004", "TRY201", "TRY203", "TRY401",
    # pyupgrade
    "UP001", "UP003", "UP004", "UP005", "UP006", "UP007", "UP008", "UP009", "UP010",
    "UP011", "UP012", "UP014", "UP017", "UP018", "UP019", "UP020", "UP021", "UP022",
    "UP023", "UP024", "UP025", "UP026", "UP028", "UP029", "UP030", "UP031", "UP032",
    "UP033", "UP034", "UP035", "UP036", "UP037", "UP039", "UP040", "UP041", "UP043",
    "UP044", "UP045", "UP046", "UP047", "UP049", "UP050",
    # pycodestyle (warnings)
    "W605",
    # flake8-2020
    "YTT101", "YTT102", "YTT103", "YTT201", "YTT202", "YTT203", "YTT204", "YTT301",
    "YTT302", "YTT303",
    # Enforced here before ruff 0.16 dropped them from its default set.
    "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714", "E721",
    "E731", "E741", "E742", "E743", "F403", "F405", "F406", "F722",
]
# `import X as X` is how a typed package marks an explicit re-export.
ignore = ["PLC0414"]

[tool.ruff.lint.isort]
combine-as-imports = true
# Explicit, because detection depends on the directory ruff runs from.
known-first-party = ["langchain_litellm"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.codespell]
skip = "*.lock"
ignore-words-list = "hel"  # "hel" + "lo" is a streaming chunk split across two deltas in the tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--strict-markers --strict-config --durations=5"
pythonpath = ["scripts"]  # plain modules, not a package; tests import them by name
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
    "integration: mark test as an integration test",
]
