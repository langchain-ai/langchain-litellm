    "PLE0304", "PLE0305", "PLE0307", "PLE0308", "PLE0309", "PLE0604", "PLE0605",
    "PLE0643", "PLE0704", "PLE1132", "PLE1142", "PLE1205", "PLE1206", "PLE1300",
    "PLE1307", "PLE1310", "PLE1507", "PLE1519", "PLE1520", "PLE1700", "PLE2502",
    "PLE2510", "PLE2512", "PLE2513", "PLE2514", "PLE2515",
    # Pylint (refactors)
    "PLR0124", "PLR0133", "PLR0206", "PLR0402", "PLR1704", "PLR1708", "PLR1711",
    "PLR1716", "PLR1722", "PLR1730", "PLR1733", "PLR1736", "PLR2044",
    # Pylint (warnings)
    "PLW0120", "PLW0127", "PLW0128", "PLW0129", "PLW0131", "PLW0133", "PLW0177",
    "PLW0211", "PLW0245", "PLW0406", "PLW0602", "PLW0604", "PLW0642", "PLW0711",
