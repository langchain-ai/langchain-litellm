    "PTH124", "PTH210",
    # flake8-pyi
    "PYI001", "PYI002", "PYI003", "PYI004", "PYI005", "PYI006", "PYI007", "PYI008",
    "PYI009", "PYI010", "PYI012", "PYI013", "PYI015", "PYI016", "PYI017", "PYI018",
    "PYI019", "PYI020", "PYI025", "PYI026", "PYI029", "PYI030", "PYI032", "PYI033",
    "PYI034", "PYI035", "PYI036", "PYI041", "PYI042", "PYI043", "PYI044", "PYI045",
    "PYI046", "PYI047", "PYI048", "PYI049", "PYI050", "PYI052", "PYI055", "PYI057",
    "PYI058", "PYI059", "PYI061", "PYI062", "PYI063", "PYI064", "PYI066",
    # flake8-return
    "RET501",
    # Ruff-specific rules
    "RUF007", "RUF008", "RUF009", "RUF010", "RUF012", "RUF013", "RUF015", "RUF016",
    "RUF017", "RUF018", "RUF019", "RUF020", "RUF022", "RUF023", "RUF024", "RUF026",
    "RUF028", "RUF030", "RUF032", "RUF033", "RUF034", "RUF040", "RUF041", "RUF046",
    "RUF048", "RUF049", "RUF051", "RUF053", "RUF057", "RUF058", "RUF059", "RUF063",
    "RUF068", "RUF100", "RUF101", "RUF200",
    # flake8-bandit
    "S102", "S110", "S112",
    # flake8-simplify
    "SIM101", "SIM102", "SIM103", "SIM107", "SIM113", "SIM114", "SIM115", "SIM117",
    "SIM118", "SIM201", "SIM202", "SIM208", "SIM210", "SIM211", "SIM220", "SIM221",
    "SIM222", "SIM223", "SIM401", "SIM905", "SIM911",
    # flake8-debugger
