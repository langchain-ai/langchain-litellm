[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-litellm"
version = "0.10.0"

description = "An integration package connecting LiteLLM and LangChain"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Akshay Dongare"}]
requires-python = ">=3.11,<4.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.6.1,<2.0.0",
    # 1.82.7 and 1.82.8 were compromised.
    "litellm>=1.83.14,<2.0.0,!=1.82.7,!=1.82.8",
    "httpx>=0.28.1,<0.29.0",
    "pydantic>=2.10.0,<3.0.0",
    "typing-extensions>=4.7.0,<5.0.0",
]

[project.urls]
Homepage = "https://docs.langchain.com/oss/python/integrations/providers/litellm"
Documentation = "https://docs.langchain.com/oss/python/integrations/chat/litellm"
Repository = "https://github.com/langchain-ai/langchain-litellm"
Issues = "https://github.com/langchain-ai/langchain-litellm/issues"
Changelog = "https://github.com/langchain-ai/langchain-litellm/releases"
Maintainer = "https://akshaydongare.com"
Twitter = "https://x.com/LangChain"
Slack = "https://www.langchain.com/join-community"
Reddit = "https://www.reddit.com/r/LangChain/"

[dependency-groups]
test = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-tests>=1.1.5,<2.0.0",
    "pytest>=7.4.4,<10.0.0",
    "pytest-asyncio>=0.23.8,<2.0.0",
    "pytest-socket>=0.6.0,<1.0.0",
    "pytest-watcher>=0.2.6,<1.0.0",
    "pytest-cov>=4.1.0,<8.0.0",
    "pytest-dotenv>=0.5.2,<1.0.0",
    "duckdb-engine>=0.13.6,<1.0.0",
    "freezegun>=1.2.2,<2.0.0",
    "responses>=0.22.0,<1.0.0",
    "lark>=1.1.5,<2.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pytest-mock>=3.10.0,<4.0.0",
    "syrupy>=4.0.2,<6.0.0",
    "requests-mock>=1.11.0,<2.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
    "blockbuster>=1.5.18,<1.6",
    "cffi>=2.0.0,<3.0.0; python_version >= '3.10'",
    "toml>=0.10.2",
]
codespell = [
    "codespell>=2.2.6,<3.0.0",
]
lint = [
    "ruff>=0.16.0,<0.17.0",
]
dev = [
    "ipykernel>=6.29.5,<8.0.0",
    "python-dotenv>=1.2.1,<2.0.0",
]
typing = [
    "langchain>=1.0.0,<2.0.0",
    "langchain-text-splitters>=0.3.7,<1.2.0",
    "mypy>=1.12,<3.0",
    "types-pyyaml>=6.0.12.2,<7.0.0.0",
    "types-requests>=2.28.11.5,<3.0.0.0",
    "types-toml>=0.10.8.1,<1.0.0.0",
    "types-pytz>=2023.3.0.0,<2027.0.0.0",
    "types-chardet>=5.0.4.6,<6.0.0.0",
    "types-redis>=4.3.21.6,<5.0.0.0",
    "mypy-protobuf>=3.0.0,<6.0.0",
    "cffi>=2.0.0,<3.0.0",
]

[tool.uv]
# A plain `uv sync` installs the locked ruff too, so an editor that uses the
# project environment lints with exactly the ruff `make lint` and CI run.
default-groups = ["dev", "lint"]

[tool.mypy]
disallow_untyped_defs = "True"
mypy_path = "scripts"  # so `make lint_tests` resolves what the tests import from there

[[tool.mypy.overrides]]
module = [
    "pytest",
    "pytest.*",
    "langchain_tests.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.ruff]
# Pins the rule set to ruff 0.16; any other minor refuses to run. Patch releases can
# still change a verdict, so `make lint`'s locked ruff is the authority.
required-version = ">=0.16.0,<0.17.0"

[tool.ruff.format]
docstring-code-format = true  # Formats code blocks in docstrings

[tool.ruff.lint]
# Full codes, never prefixes, so no ruff upgrade or preview mode can add a rule unseen.
select = [
    # ruff 0.16's default rule set, all 413 codes, as https://docs.astral.sh/ruff/default-rules/
    # lists them. FA100, FA102, UP040, UP043, UP046 and UP047 wait on a newer requires-python.
    # flake8-async
    "ASYNC100", "ASYNC105", "ASYNC115", "ASYNC116", "ASYNC210", "ASYNC220", "ASYNC221",
    "ASYNC222", "ASYNC230", "ASYNC251",
    # flake8-bugbear
    "B002", "B003", "B004", "B005", "B006", "B008", "B009", "B010", "B012", "B013",
    "B014", "B015", "B016", "B017", "B018", "B019", "B020", "B021", "B022", "B023",
    "B025", "B026", "B029", "B030", "B031", "B032", "B033", "B035", "B039",
    # flake8-blind-except
    "BLE001",
    # flake8-comprehensions
    "C400", "C401", "C402", "C403", "C404", "C405", "C406", "C408", "C409", "C410",
    "C411", "C413", "C414", "C415", "C417", "C418", "C419",
    # pydocstyle
    "D419",
    # flake8-datetimez
    "DTZ001", "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ007", "DTZ011",
    "DTZ012", "DTZ901",
    # pycodestyle (errors)
    "E722", "E902",
    # flake8-executable
    "EXE001", "EXE002", "EXE004", "EXE005",
    # Pyflakes
    "F401", "F402", "F404", "F407", "F501", "F502", "F503", "F504", "F505", "F506",
    "F507", "F508", "F509", "F521", "F522", "F523", "F524", "F525", "F541", "F601",
    "F602", "F621", "F622", "F631", "F632", "F633", "F634", "F701", "F702", "F704",
    "F706", "F707", "F811", "F821", "F822", "F823", "F841", "F842", "F901",
    # flake8-future-annotations
    "FA100", "FA102",
    # flynt
    "FLY002",
    # refurb
    "FURB105", "FURB122", "FURB129", "FURB132", "FURB136", "FURB157", "FURB161",
    "FURB162", "FURB163", "FURB166", "FURB167", "FURB168", "FURB169", "FURB177",
    "FURB181", "FURB188", "FURB192",
    # flake8-logging-format
    "G010", "G101", "G201", "G202",
    # isort
    "I001",
    # flake8-gettext
    "INT001", "INT002", "INT003",
    # flake8-implicit-str-concat
    "ISC004",
    # flake8-logging
    "LOG001", "LOG002", "LOG009", "LOG014", "LOG015",
    # pep8-naming
    "N999",
    # Perflint
    "PERF101", "PERF102", "PERF402",
