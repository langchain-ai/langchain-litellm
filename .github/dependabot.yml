version: 2
updates:
  # Python dependencies via uv
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Version updates wait a week so a bad release can be yanked first;
    # security updates ignore the cooldown.
    cooldown:
      default-days: 7
    versioning-strategy: increase
    # Lock-only pytest plugins too: a stale one breaks a pytest bump. Allowing every
    # lock-only package overruns Dependabot's 55-minute job, which then opens no PR.
    allow:
      - dependency-type: "direct"
      - dependency-name: "pytest-*"
        dependency-type: "indirect"
    ignore:
      - dependency-name: "langchain-core"
      - dependency-name: "langchain"
      - dependency-name: "langchain-classic"
      - dependency-name: "langchain-text-splitters"
      - dependency-name: "langchain-tests"
      - dependency-name: "langchain-model-profiles"
      # Every released langchain-tests requires syrupy<6, so a syrupy 6 bump cannot
      # resolve and fails the run. Drop this once a release allows syrupy 6.
      - dependency-name: "syrupy"
        versions: [">=6.0.0"]
    groups:
      # All routine version bumps batched into one PR per week
      python-deps:
        applies-to: version-updates
        patterns:
          - "*"
      # Security fixes always get their own immediate PR, never batched with routine bumps
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions — keeps workflow action versions fresh
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  # pre-commit hook revs; `repo: local` hooks come from uv.lock instead
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        applies-to: version-updates
        patterns:
          - "*"

  # devcontainer base image and uv image
  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      devcontainer:
        applies-to: version-updates
        patterns:
          - "*"
