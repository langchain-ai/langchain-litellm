name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Last-resort manual publish. Enter the tag to publish (e.g. langchain-litellm==0.x.x) or leave empty to skip. Still requires approval on the pypi environment."
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-please:
    # Only runs on push to main; workflow_dispatch skips this job.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      releases_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml but does not regenerate lockfiles.
  # This job updates uv.lock on the release branch so it stays in sync.
  # See: https://github.com/googleapis/release-please/issues/2561
  update-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Update lockfile
        run: uv lock
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --staged --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore: update uv.lock"
            git push
          fi

  pypi-publish:
    # Publishes to PyPI in two situations, both gated by the `pypi`
    # environment (its required reviewers are the human approval step):
    #   1. release-please cut a release on push to main (releases_created == true).
    #      The matching tag/commit already exists on main at this point.
    #   2. Last-resort manual publish via workflow_dispatch with a tag input.
    # Any one listed reviewer can approve, so the team is never blocked on a
    # single person.
    needs: release-please
    if: |
      always() &&
      (
        needs.release-please.outputs.releases_created == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '')
      )
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.tag ||
              github.sha
            }}
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Build package
        run: uv build
      - name: Verify build artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always