name: Release
on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Last-resort escape hatch only. Enter the tag to publish to PyPI manually (e.g. langchain-litellm-v0.x.x) or leave empty to skip. Use only if release:published trigger failed."
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  release-please:
    # Only runs on push to main; release and workflow_dispatch events skip this job
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps pyproject.toml but does not regenerate lockfiles.
  # This job updates uv.lock on the release branch so it stays in sync.
  # See: https://github.com/googleapis/release-please/issues/2561
  update-lockfile:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ fromJson(needs.release-please.outputs.pr).headBranchName }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Update lockfile
        run: uv lock
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          if git diff --staged --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore: update uv.lock"
            git push
          fi

  pypi-publish:
    # Runs in two cases:
    # 1. A draft GitHub Release is reviewed and published in the UI (release: published flow)
    # 2. Last-resort escape hatch via workflow_dispatch with a tag input
    # No always() needed — this job is fully decoupled from release-please.
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for PyPI OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: >-
            ${{
              github.event_name == 'workflow_dispatch' && inputs.tag ||
              github.ref
            }}
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.10"
      - name: Build package
        run: uv build
      - name: Verify build artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always