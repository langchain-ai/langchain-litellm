name: "CI"

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "true"

jobs:
  python-versions:
    name: "Python versions"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pyproject.toml's classifiers are the one list of supported versions.
      - id: read
        run: echo "versions=$(python3 scripts/python_versions.py --matrix)" >> "$GITHUB_OUTPUT"

  check-lockfile:
    name: "Check lockfile"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv lock --check

  lint:
    name: "Lint and type check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      # ruff check, ruff format --diff and mypy, as defined in the Makefile
      - run: make lint

  spell-check:
    name: "Spell check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # codespell reads --toml via tomllib, which is stdlib only from 3.11
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - run: make spell_check

  pre-commit:
    name: "pre-commit"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      # Commit-stage hooks only; the lint job already runs mypy, the pre-push hook.
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: python-versions
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Sets UV_PYTHON, so uv runs the matrix version instead of .python-version's.
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      - name: Run unit tests
        run: uv run python -m pytest tests/unit_tests/ --disable-socket --allow-unix-socket -q

  test-floors:
    name: "Test dependency floors (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: python-versions
    strategy:
      matrix:
        python-version: ${{ fromJSON(needs.python-versions.outputs.versions) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          # Sets UV_PYTHON, so uv runs the matrix version instead of .python-version's.
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group test

      # Each runtime dependency at the lower bound pyproject.toml declares, over the
      # locked test tools. --no-sync keeps uv run from restoring the lock.
      - name: Install the declared floors
        run: |
          uv run --no-sync python scripts/dependency_floors.py > floors.txt
          uv pip install -r floors.txt
          uv run --no-sync python scripts/dependency_floors.py --check

      - name: Run unit tests
        run: uv run --no-sync python -m pytest tests/unit_tests/ --disable-socket --allow-unix-socket -q
